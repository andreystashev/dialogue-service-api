name: API and worker tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dialogue_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      COUNT_REQUESTS_PER_MINUTES: '100'
      SECRET_KEY: ci-test-secret
      OPENAI_URL: http://localhost/unused
      OPENAI_TOKEN: ''
      CELERY_BROKER_URL: memory://
      CELERY_RESULT_BACKEND: cache+memory://
      POSTGRES_HOSTNAME: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dialogue_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      # Celery 4 has legacy metadata; pip 24.1+ rejects that release.
      - run: python -m pip install pip==24.0
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests/unit -v
      - run: python -m pytest tests/app -q
      - run: python -m compileall -q app tests
